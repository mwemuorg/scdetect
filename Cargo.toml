[package]
name = "scdetect"
version = "0.1.0"
edition = "2024"
description = "Shellcode detector: emulates from every offset and ranks by executed instructions"

[dependencies]
libmwemu = "0.25.5"
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
ahash = "0.8"
goblin = "0.9"
memmap2 = "0.9"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
panic = "unwind"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["ptrace", "process", "uio"] }
